name: Release

# The disk image is signed and notarized locally (scripts/release-notarized.sh)
# and attached to the GitHub release. This job only moves the Homebrew cask
# on main to that image, and it refuses an image Apple has not notarized.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cask:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point the Homebrew cask at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          gh release download "v${VERSION}" \
            --pattern "NotchBot-${VERSION}.dmg" \
            --dir dist \
            --clobber
          xcrun stapler validate "dist/NotchBot-${VERSION}.dmg"
          MOUNT="$(mktemp -d)"
          hdiutil attach "dist/NotchBot-${VERSION}.dmg" -readonly -nobrowse -mountpoint "$MOUNT"
          spctl --assess --type execute --verbose=2 "$MOUNT/NotchBot.app"
          hdiutil detach "$MOUNT"
          SHA="$(shasum -a 256 "dist/NotchBot-${VERSION}.dmg" | awk '{print $1}')"
          python3 - "$VERSION" "$SHA" <<'PY'
          import pathlib, sys
          version, sha = sys.argv[1], sys.argv[2]
          path = pathlib.Path("Casks/notchbot.rb")
          lines = []
          for line in path.read_text().splitlines(keepends=True):
              if line.startswith('  version "'):
                  lines.append(f'  version "{version}"\n')
              elif line.startswith('  sha256 "'):
                  lines.append(f'  sha256 "{sha}"\n')
              else:
                  lines.append(line)
          path.write_text("".join(lines))
          PY
          git add Casks/notchbot.rb
          if git diff --cached --quiet; then
            echo "Cask already points at ${VERSION}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Point the Homebrew cask at ${VERSION}."
          git push origin HEAD:main
